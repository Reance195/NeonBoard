<!DOCTYPE html>
<html lang="zh-CN" data-theme="neon">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeonBoard 界面重排 · 弹窗壳原型</title>
<link rel="stylesheet" href="prototype.css">
<style>
  body { padding: 24px 0 56px; min-height: 100vh; }

  .proto-bar {
    width: 1180px;
    margin: 0 auto 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .proto-bar h1 { font-size: 14px; margin: 0; font-weight: 700; }
  .proto-bar .sub { font-size: 11px; color: #7C8BA1; }
  .proto-bar .spacer { flex: 1; }

  .proto-group {
    display: flex; gap: 2px; padding: 2px;
    border-radius: 8px; border: 1px solid rgba(34,211,238,.16);
    background: rgba(255,255,255,.03);
  }
  .proto-group button {
    padding: 5px 10px; border-radius: 6px; font-size: 11px; color: #7C8BA1;
    transition: all .16s ease;
  }
  .proto-group button:hover { color: #E6F1FF; }
  .proto-group button.on {
    background: rgba(34,211,238,.2); color: #22D3EE; font-weight: 600;
  }

  /* 弹窗索引表 */
  .index {
    width: 1180px; margin: 0 auto 18px;
    border-radius: 12px; border: 1px solid rgba(34,211,238,.14);
    background: rgba(255,255,255,.02); padding: 14px 16px;
  }
  .index h2 { margin: 0 0 10px; font-size: 12px; color: #E6F1FF; letter-spacing: .5px; }
  .index table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .index th, .index td {
    text-align: left; padding: 5px 8px;
    border-bottom: 1px solid rgba(255,255,255,.06); color: #A9B6C8;
  }
  .index th { color: #7C8BA1; font-weight: 600; font-size: 10px; letter-spacing: .8px; }
  .index td b { color: #E6F1FF; }
  .index .pill {
    display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 9px;
    background: rgba(34,211,238,.14); color: #22D3EE;
  }
  .index .pill--drawer { background: rgba(167,139,250,.16); color: #A78BFA; }
  .index .pill--changed { background: rgba(251,113,133,.15); color: #FB7185; }
  .index .pill--same { background: rgba(255,255,255,.07); color: #7C8BA1; }
  .index tr:hover td { background: rgba(255,255,255,.03); }
  .index tr.clickable { cursor: pointer; }
  .index tr.clickable:hover td { background: rgba(34,211,238,.07); }

  /* 演示台 */
  .stage {
    width: 1180px; margin: 0 auto;
    border-radius: 12px; border: 1px solid rgba(34,211,238,.14);
    background: rgba(255,255,255,.02); overflow: hidden;
  }

  .stage-bar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,.07);
  }
  .stage-bar .title { font-size: 12px; color: #E6F1FF; font-weight: 600; }
  .stage-bar .meta { font-size: 10px; color: #7C8BA1; }
  .stage-bar .spacer { flex: 1; }

  .stage-viewport {
    position: relative;
    height: 560px;
    overflow: hidden;
    background:
      radial-gradient(700px 420px at 65% -10%, rgba(34,211,238,.08), transparent 70%),
      repeating-linear-gradient(0deg, rgba(34,211,238,.035) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, rgba(34,211,238,.035) 0 1px, transparent 1px 28px),
      #070810;
  }

  /* 舞台里的假看板底图，让弹窗有上下文 */
  .stage-bg {
    position: absolute; inset: 0; padding: 14px;
    display: flex; gap: 10px; opacity: .5;
  }
  .stage-bg .col {
    flex: 1; border-radius: 10px; border: 1px solid rgba(255,255,255,.06);
    background: rgba(255,255,255,.02); padding: 8px;
  }
  .stage-bg .col h4 { margin: 0 0 8px; font-size: 10px; color: #5C6B80; }
  .stage-bg .blk {
    height: 44px; border-radius: 7px; margin-bottom: 7px;
    background: rgba(255,255,255,.045);
  }

  /* 舞台里的弹窗 */
  .stage-viewport .nb-dialog,
  .stage-viewport .nb-drawer {
    position: absolute;
  }
  .stage-viewport .nb-dialog {
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    max-height: calc(100% - 32px);
    display: flex;
  }
  .stage-viewport .nb-dialog[data-open="0"] { display: none; }
  .stage-viewport .nb-drawer { top: 0; right: 0; bottom: 0; display: flex; }

  /* 规格注记 */
  .spec-note {
    padding: 10px 14px; border-top: 1px solid rgba(255,255,255,.07);
    font-size: 10px; color: #7C8BA1; line-height: 1.7;
  }
  .spec-note b { color: #22D3EE; }
  .spec-note .k {
    color: #A78BFA; font-family: "Cascadia Code", Consolas, monospace;
  }

  /* 阶段条（设置面板用） */
  .nb-tabs {
    display: flex; gap: 2px; border-bottom: 1px solid var(--nb-divider);
    margin: calc(var(--nb-space-md) * -1) calc(var(--nb-dialog-pad) * -1) 0;
    padding: 0 var(--nb-dialog-pad);
  }
  .nb-tab {
    padding: 9px 12px; font-size: var(--nb-font-caption); color: var(--nb-muted);
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .nb-tab.on { color: var(--nb-cyan); border-bottom-color: var(--nb-cyan); font-weight: 600; }

  /* 命令面板专用 */
  .nb-cmdlist { display: flex; flex-direction: column; gap: 1px; }
  .nb-cmdrow {
    display: flex; align-items: center; gap: 10px;
    height: 38px; padding: 0 10px; border-radius: 7px;
    font-size: var(--nb-font-body); color: var(--nb-text);
  }
  .nb-cmdrow:hover, .nb-cmdrow.on { background: var(--nb-accent-soft); }
  .nb-cmdrow .cat {
    font-size: 9px; color: var(--nb-muted); border: 1px solid var(--nb-border);
    border-radius: 4px; padding: 1px 5px; flex: 0 0 auto;
  }
  .nb-cmdrow .sub { margin-left: auto; font-size: 10px; color: var(--nb-muted); }

  /* 主题选择格 */
  .nb-themegrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .nb-themecell {
    border-radius: var(--nb-radius-control); border: 1px solid var(--nb-border);
    padding: 9px; background: var(--nb-input);
  }
  .nb-themecell.on { border-color: var(--nb-cyan); background: var(--nb-accent-soft); }
  .nb-themecell .sw { display: flex; gap: 4px; margin-bottom: 7px; }
  .nb-themecell .sw i { width: 12px; height: 12px; border-radius: 3px; }
  .nb-themecell .nm { font-size: var(--nb-font-caption); font-weight: 600; }
  .nb-themecell .ds { font-size: 9px; color: var(--nb-muted); margin-top: 2px; }

  /* 表格 */
  .nb-table { width: 100%; border-collapse: collapse; font-size: var(--nb-font-caption); }
  .nb-table th {
    text-align: left; padding: 6px 8px; color: var(--nb-muted);
    font-size: var(--nb-font-micro); letter-spacing: .8px;
    border-bottom: 1px solid var(--nb-divider); font-weight: 600;
  }
  .nb-table td { padding: 7px 8px; border-bottom: 1px solid rgba(255,255,255,.05); color: var(--nb-text); }
  .nb-table td.m { color: var(--nb-muted); }

  /* 进度条 */
  .nb-prog { height: 5px; border-radius: 3px; background: rgba(255,255,255,.07); overflow: hidden; }
  .nb-prog i { display: block; height: 100%; border-radius: 3px; background: var(--nb-cyan); }

  /* 日志 */
  .nb-log {
    font-family: "Cascadia Code", Consolas, monospace; font-size: 10px;
    line-height: 1.7; color: var(--nb-muted);
    background: rgba(0,0,0,.3); border: 1px solid var(--nb-border);
    border-radius: var(--nb-radius-control); padding: 9px 11px;
    max-height: 150px; overflow-y: auto;
  }
  .nb-log b { color: var(--nb-success); font-weight: 400; }
  .nb-log .err { color: var(--nb-danger); }
</style>
</head>
<body>

<div class="proto-bar">
  <h1>NeonBoard 界面重排 · 弹窗壳</h1>
  <span class="sub">13 个二级界面 + 4 个执行弹窗，统一到同一套壳</span>
  <span class="spacer"></span>
  <div class="proto-group" id="themeGroup">
    <button data-theme="neon" class="on">霓虹青</button>
    <button data-theme="violet">赛博紫</button>
    <button data-theme="sunset">落日橙</button>
    <button data-theme="abyss">深海蓝</button>
    <button data-theme="forest">森野绿</button>
    <button data-theme="mono">极夜灰</button>
  </div>
</div>

<!-- ============ 索引表 ============ -->
<div class="index">
  <h2>壳规格统一对照（点任意行在下方预览）</h2>
  <table>
    <thead>
      <tr><th>界面</th><th>形态</th><th>宽度档</th><th>现状</th><th>新壳</th><th>主要变化</th></tr>
    </thead>
    <tbody id="indexBody"></tbody>
  </table>
</div>

<!-- ============ 演示台 ============ -->
<div class="stage">
  <div class="stage-bar">
    <span class="title" id="stageTitle">新建任务</span>
    <span class="meta" id="stageMeta"></span>
    <span class="spacer"></span>
    <span class="meta">键盘：Esc 关闭 · 底部按钮右对齐 · 标题 18 px</span>
  </div>
  <div class="stage-viewport" id="stage">
    <div class="stage-bg">
      <div class="col"><h4>待办 359</h4><div class="blk"></div><div class="blk"></div><div class="blk"></div></div>
      <div class="col"><h4>进行中 17</h4><div class="blk"></div><div class="blk"></div></div>
      <div class="col"><h4>已完成 176</h4><div class="blk"></div><div class="blk"></div></div>
    </div>
    <!-- 各弹窗的 DOM 由脚本注入 -->
  </div>
  <div class="spec-note" id="stageNote"></div>
</div>

/* =========================================================
   3. 渲染
   ========================================================= */

const SIZE_LABEL = { sm: 'sm · 440 px', md: 'md · 560 px', lg: 'lg · 720 px', drawer: 'drawer · 320 px' };
const FORM_LABEL = { dialog: '居中弹窗', drawer: '右侧抽屉' };

/* 每个界面的底部按钮条：统一右对齐，主操作用 accent */
const FOOT = {
  composer: '<div class="spacer"></div><button class="nb-btn">取消</button><button class="nb-btn nb-btn--primary">创建</button>',
  settings: '<div class="spacer"></div><button class="nb-btn">取消</button><button class="nb-btn nb-btn--primary">保存</button>',
  library: '<span style="font-size:10px;color:var(--nb-muted)">来源：Gitee → GitHub 自动回退</span><div class="spacer"></div><button class="nb-btn nb-btn--sm">刷新市场</button><button class="nb-btn nb-btn--sm">重新扫描</button><button class="nb-btn nb-btn--sm">打开目录</button>',
  permission: '<div class="spacer"></div><button class="nb-btn">拒绝</button><button class="nb-btn nb-btn--primary">允许所选</button>',
  preview: '<div class="spacer"></div><button class="nb-btn nb-btn--sm">刷新</button><button class="nb-btn nb-btn--primary nb-btn--sm">出包…</button>',
  detail: '<div class="spacer"></div><button class="nb-btn">取消</button><button class="nb-btn">编辑</button><button class="nb-btn nb-btn--primary">保存</button>',
  market: '<div class="spacer"></div><button class="nb-btn">关闭</button>',
  columns: '<div class="spacer"></div><button class="nb-btn">取消</button><button class="nb-btn nb-btn--primary">完成</button>',
  onboard: '<button class="nb-btn nb-btn--ghost">载入三张示例卡</button><div class="spacer"></div><button class="nb-btn nb-btn--ghost">跳过</button><button class="nb-btn nb-btn--primary">下一步</button>',
  execconfirm: '<div class="spacer"></div><button class="nb-btn">取消</button><button class="nb-btn nb-btn--primary">确认执行</button>',
  execpanel: '<button class="nb-btn nb-btn--sm">查看完整日志</button><div class="spacer"></div><button class="nb-btn">重试</button><button class="nb-btn nb-btn--primary">标为已办结</button>',
  nightbatch: '<div class="spacer"></div><button class="nb-btn">取消</button><button class="nb-btn nb-btn--primary">入队（3 张）</button>',
  execqueue: '<span style="font-size:10px;color:var(--nb-muted)">并发 1 · 运行 1 · 排队 2</span><div class="spacer"></div><button class="nb-btn nb-btn--sm">暂停全部</button><button class="nb-btn nb-btn--primary nb-btn--sm">恢复</button>'
};

function renderIndex() {
  const body = document.getElementById('indexBody');
  body.innerHTML = SHELLS.map(s => `
    <tr class="clickable" data-id="${s.id}">
      <td><b>${s.name}</b></td>
      <td><span class="pill ${s.form === 'drawer' ? 'pill--drawer' : ''}">${FORM_LABEL[s.form]}</span></td>
      <td><span class="pill pill--same">${SIZE_LABEL[s.size]}</span></td>
      <td class="m">${s.src}</td>
      <td><span class="pill ${s.change === 'changed' ? 'pill--changed' : 'pill--same'}">${s.change === 'changed' ? '需改' : '微调'}</span></td>
      <td class="m">${s.sub}</td>
    </tr>
  `).join('');

  body.addEventListener('click', function (e) {
    const tr = e.target.closest('tr.clickable');
    if (!tr) return;
    show(tr.dataset.id);
    document.querySelector('.stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
}

function show(id) {
  const s = SHELLS.find(x => x.id === id);
  if (!s) return;
  const stage = document.getElementById('stage');

  // 清掉旧弹窗
  stage.querySelectorAll('.nb-dialog, .nb-drawer').forEach(el => el.remove());

  const content = BODIES[s.id] || '';
  const foot = FOOT[s.id];

  const el = document.createElement('div');
  if (s.form === 'drawer') {
    el.className = 'nb-drawer';
    el.innerHTML = `
      <div class="nb-dialog-head">
        <div class="nb-dialog-heading">
          <div class="nb-dialog-title">${s.title}</div>
          <div class="nb-dialog-sub">${s.sub}</div>
        </div>
        <button class="nb-dialog-close">✕</button>
      </div>
      <div class="nb-dialog-body">${content}</div>
    `;
  } else {
    el.className = 'nb-dialog nb-dialog--' + s.size;
    el.innerHTML = `
      <div class="nb-dialog-head">
        <div class="nb-dialog-heading">
          <div class="nb-dialog-title">${s.title}</div>
          <div class="nb-dialog-sub">${s.sub}</div>
        </div>
        <button class="nb-dialog-close">✕</button>
      </div>
      <div class="nb-dialog-body">${content}</div>
      ${foot ? `<div class="nb-dialog-foot">${foot}</div>` : ''}
    `;
  }
  stage.appendChild(el);

  document.getElementById('stageTitle').textContent = s.name;
  document.getElementById('stageMeta').textContent = s.src + ' · ' + FORM_LABEL[s.form] + ' · ' + SIZE_LABEL[s.size];
  document.getElementById('stageNote').innerHTML = s.note;
}

/* 主题切换 */
document.getElementById('themeGroup').addEventListener('click', function (e) {
  const btn = e.target.closest('button');
  if (!btn) return;
  [...this.querySelectorAll('button')].forEach(b => b.classList.toggle('on', b === btn));
  document.documentElement.setAttribute('data-theme', btn.dataset.theme);
});

renderIndex();
show('composer');
</script>
