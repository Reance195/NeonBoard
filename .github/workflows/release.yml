name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签（留空则只产出 artifact，不发 Release）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: 打包安装包
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 校验标签与源码版本一致
        shell: pwsh
        run: |
          # 版本号唯一来源是 CMakeLists 的 project(VERSION)；标签决定资产名与更新清单。
          # 两者不一致会产出「装上了新版却仍自报旧版本」的包 —— 更新检查据此判定
          # 「已是最新」，用户永远收不到下一次更新，而且事后极难发现。故构建前先拦。
          $tag = '${{ github.event.inputs.tag }}'
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = '${{ github.ref_name }}' }
          $tagVersion = $tag.TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($tagVersion) -or $tagVersion -eq 'main') {
            Write-Host '未以标签触发，跳过版本一致性校验'
            exit 0
          }
          $raw = Get-Content -LiteralPath 'CMakeLists.txt' -Raw -Encoding UTF8
          $m = [regex]::Match($raw, 'project\s*\(\s*NeonBoard\s+VERSION\s+([0-9][0-9A-Za-z.\-]*)')
          if (-not $m.Success) { throw '无法从 CMakeLists.txt 解析 project(NeonBoard VERSION x.y.z)' }
          $cmakeVersion = $m.Groups[1].Value
          Write-Host "标签版本 $tagVersion / 源码版本 $cmakeVersion"
          if ($tagVersion -ne $cmakeVersion) {
            throw "标签 $tag 与 CMakeLists 版本 $cmakeVersion 不一致：请先改 project(VERSION) 再打标签"
          }

      - name: 准备 MSVC 编译环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 安装 Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtshadertools'
          cache: true
          cache-key-prefix: 'neonboard-qt'

      - name: 安装 Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: 编译缓存（sccache）
        # DX-37：发布构建此前零编译缓存，冷编译占「构建 Release」约 76% 墙钟（8m36s）。
        # ccache-action 负责 sccache 的安装与缓存目录持久化，key 与 ci.yml 同一套：
        # CI 主构建喂热的，发布构建直接吃；Qt 安装目录的缓存由上方 install-qt-action 负责。
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          key: neonboard-sccache-${{ runner.os }}

      - name: 安装 Ninja
        # build.ps1 默认 Ninja 生成器；runner 上显式装一份，不依赖 VS 自带的 PATH 顺序。
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: 配置并编译 Release（Ninja + sccache）
        # DX-37 实测：VS/MSBuild 生成器不支持 CMAKE_<LANG>_COMPILER_LAUNCHER —— flag 传了、
        # CMakeCache 里也有，MSBuild 照样用干净 cl.exe 直编（sccache 0 请求，见 pitfalls §3.24）。
        # Ninja 才真正吃 launcher，且是 build.ps1 的默认路径：配置+编译收口在 build.ps1
        # 单一实现，/showIncludes 前缀字节（DX-52）与 sccache 命中率打印（DX-16 口径）都由它兜住。
        # exe 单配置直接落 build\NeonBoard.exe（deploy.ps1 两种布局都认）。
        # Qt 经 NEONBOARD_QT_ROOT 传递而非 -QtRoot 参数：build.ps1 点源 dev-env.ps1 时，
        # 其 param([string]$QtRoot='') 会在宿主作用域覆写 -QtRoot 已绑定的值
        # （DX-37 发布 run 42330524049 实测：参数明明传了，Resolve-QtRoot 却收到空）。
        # NEONBOARD_QT_ROOT 是 build.ps1 的正式探测序第二通道，点源覆写不了环境变量。
        shell: pwsh
        env:
          NEONBOARD_QT_ROOT: ${{ env.QT_ROOT_DIR }}
        run: pwsh -NoProfile -File scripts\build.ps1 -Config Release -BuildDir build

      - name: sccache 生效核验与命中率
        # DX-37：加速器「配置存在 ≠ 生效」，判据必须落到实测：launcher 进了 CMakeCache
        # 且 Compile requests > 0（ launcher 挂上但一次编译都没经过它，等于没挂）。
        # 未启用只告警不阻断 —— 缓存是加速器，不是发布前提（fail-soft + 告警）。
        if: always()
        shell: pwsh
        run: |
          $launcher = Select-String -LiteralPath 'build\CMakeCache.txt' -Pattern '^CMAKE_(C|CXX)_COMPILER_LAUNCHER' -ErrorAction SilentlyContinue
          if (-not $launcher) {
            Write-Host 'sccache: 未启用（CMakeCache 里没有 COMPILER_LAUNCHER）——本次是未加速的全量冷编译' -ForegroundColor Yellow
            exit 0
          }
          $launcher | ForEach-Object { Write-Host "sccache: 已启用（$($_.Line.Trim())）" }
          if (Get-Command sccache -ErrorAction SilentlyContinue) { sccache --show-stats }
          else { Write-Host 'sccache: 未启用（PATH 上找不到 sccache.exe）' -ForegroundColor Yellow }

      - name: 数据层自检
        shell: pwsh
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          $exe = Join-Path $PWD 'build\NeonBoard.exe'
          $proc = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput selftest.out -RedirectStandardError selftest.err
          Get-Content selftest.out -ErrorAction SilentlyContinue
          Get-Content selftest.err -ErrorAction SilentlyContinue
          # 退出码检查归位在本步：写溯源信息步骤里没有 $proc（跨步骤变量不存在），
          # 那里的引用在非严格模式下恒 $null ≠ 0，导致该步无条件 throw（DX-37 run 实测）。
          if ($proc.ExitCode -ne 0) { throw "自检失败，退出码 $($proc.ExitCode)" }

      - name: 写溯源信息
        # DX-36：必须在「生成便携版 / 编译安装包」**之前**写，且要写进 dist\NeonBoard\
        # （安装树）——以前只在编译安装包之后写 dist\BUILD-INFO.txt，安装器打包的是
        # dist\NeonBoard\*，BUILD-INFO 永远不进安装树，安装回执的 commit 字段恒为 unknown。
        shell: pwsh
        run: |
          $commit = (git rev-parse HEAD).Trim()
          # DX-37 发布 run 实测：本步被 DX-36 提前到 deploy 之前后，dist\ 还不存在，
          # 直接 WriteAllText 会报「Could not find a part of the path」—— 先建目录再写。
          $exeHash = (Get-FileHash -LiteralPath 'build\NeonBoard.exe' -Algorithm SHA256).Hash
          $lines = @(
            'NeonBoard build info',
            "generated : $((Get-Date).ToString('yyyy-MM-dd HH:mm:ss'))",
            "commit    : $commit",
            "exe sha256: $exeHash"
          )
          $text = ($lines -join "`n") + "`n"
          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
          [System.IO.File]::WriteAllText((Join-Path $PWD 'dist\BUILD-INFO.txt'), $text, (New-Object System.Text.UTF8Encoding($false)))
          New-Item -ItemType Directory -Force -Path 'dist\NeonBoard' | Out-Null
          [System.IO.File]::WriteAllText((Join-Path $PWD 'dist\NeonBoard\BUILD-INFO.txt'), $text, (New-Object System.Text.UTF8Encoding($false)))

      - name: 生成便携版
        shell: pwsh
        run: pwsh -NoProfile -File scripts\deploy.ps1 -SkipBuild

      - name: 编译安装包
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { $iscc = 'C:\Program Files\Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path -LiteralPath $iscc)) { throw '找不到 ISCC（Inno Setup 编译器）' }
          $outDir = Join-Path $PWD 'dist'
          # 版本号从 CMakeLists 取（唯一来源），不读 .iss 里的兜底常量
          $raw = Get-Content -LiteralPath 'CMakeLists.txt' -Raw -Encoding UTF8
          $m = [regex]::Match($raw, 'project\s*\(\s*NeonBoard\s+VERSION\s+([0-9][0-9A-Za-z.\-]*)')
          if (-not $m.Success) { throw '无法从 CMakeLists.txt 解析版本号' }
          $appVersion = $m.Groups[1].Value
          Write-Host "安装包版本 $appVersion"
          & $iscc installer\neonboard.iss "/O$outDir" "/DMyAppVersion=$appVersion"
          if ($LASTEXITCODE -ne 0) { throw "安装包编译失败：$LASTEXITCODE" }

      - name: 验证便携包可独立运行
        shell: pwsh
        run: |
          # 两道门，缺一不可：
          # 1) 拒绝 0 字节 DLL —— windeployqt 偶尔只建文件不写内容（Qt6Qml.dll 踩过），
          #    这种包装到用户机器上会启动即崩，且连日志都不会打一行，事后极难定位；
          # 2) 便携包必须能自己跑起来 —— 自带 Qt 运行库，不注入 PATH，等同用户真实环境。
          $dist = Join-Path $PWD 'dist\NeonBoard'
          $empty = Get-ChildItem -LiteralPath $dist -Recurse -File -Include '*.dll','*.exe' |
            Where-Object { $_.Length -eq 0 }
          if ($empty) {
            $names = ($empty | ForEach-Object { "  " + $_.FullName }) -join "`n"
            throw "部署目录存在 0 字节文件，发布中止：`n$names"
          }

          $exe = Join-Path $dist 'NeonBoard.exe'
          $proc = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) { throw "便携包自检失败，退出码 $($proc.ExitCode)" }
          Write-Host '便携包自检通过' -ForegroundColor Green

      - name: 解析版本号与便携包
        shell: pwsh
        run: |
          # 打标签时 ref_name 就是 tag；手动触发且未填 tag 时回落 CMakeLists 的源码版本
          $tag = '${{ github.event.inputs.tag }}'
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = '${{ github.ref_name }}' }
          $version = $tag.TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($version) -or $version -eq 'main') {
            $raw = Get-Content -LiteralPath 'CMakeLists.txt' -Raw -Encoding UTF8
            $m = [regex]::Match($raw, 'project\s*\(\s*NeonBoard\s+VERSION\s+([0-9][0-9A-Za-z.\-]*)')
            if (-not $m.Success) { throw '无法从 CMakeLists.txt 解析版本号' }
            $version = $m.Groups[1].Value
            $tag = "v$version"
          }
          $zip = Join-Path $PWD "dist\NeonBoard-$version-portable.zip"
          # 便携版自更新靠 zip：客户端下载后解压，主程序退出时由脚本覆盖文件
          Compress-Archive -Path (Join-Path $PWD 'dist\NeonBoard\*') -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path -LiteralPath $zip)) { throw "便携版压缩包未生成：$zip" }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PORTABLE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "版本 $version / 便携包 $((Get-Item $zip).Length / 1MB) MB"

      - name: 查询并下载上一版本便携包
        id: prev-release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 增量包要拿「上一版的文件集合」做对比，而 fresh runner 的 dist/ 里只有本次产物 ——
          # 上一版本的 portable.zip 只存在于 Release 资产上，必须回头下载，不能在工作区里找。
          # step output 只认 $env:GITHUB_OUTPUT：`Write-Output "value=x"` 不会填进
          # steps.<id>.outputs.<name>，下一步永远取到空串，整条增量链路静默跳过。
          $prevVersion = ''
          $prevZip = ''
          $headers = @{
            'Authorization' = "Bearer $env:GITHUB_TOKEN"
            'Accept'        = 'application/vnd.github+json'
          }
          try {
            $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases" `
              -Headers $headers -ErrorAction Stop
            $prev = $releases |
              Where-Object { -not $_.draft -and -not $_.prerelease -and $_.tag_name -ne $env:RELEASE_TAG } |
              Sort-Object { [DateTime]$_.published_at } -Descending |
              Select-Object -First 1
            $asset = $null
            if ($prev) {
              $asset = $prev.assets | Where-Object { $_.name -like 'NeonBoard-*-portable.zip' } |
                Select-Object -First 1
            }
            if (-not $asset) {
              Write-Host "ℹ 没有可对比的上一版本便携包（首次发布，或旧 release 没带 portable 资产）" -ForegroundColor Gray
            } else {
              $prevVersion = $prev.tag_name.TrimStart('v')
              $prevZip = Join-Path $PWD "dist\$($asset.name)"
              $dl = $headers.Clone()
              $dl['Accept'] = 'application/octet-stream'
              Invoke-WebRequest -Uri $asset.url -Headers $dl -OutFile $prevZip -ErrorAction Stop
              Write-Host "✓ 上一版本 $prevVersion 的便携包已下载：$((Get-Item $prevZip).Length / 1MB) MB" -ForegroundColor Green
            }
          } catch {
            # 增量是带宽优化，不是发布前提：查不到就只出全量包，别让一次 API 抖动红掉整条发布
            Write-Host "⚠ 查询/下载上一版本失败：$($_.Exception.Message)，本次跳过增量包" -ForegroundColor Yellow
            $prevVersion = ''
            $prevZip = ''
          }
          "prev-version=$prevVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "prev-zip=$prevZip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: 生成增量升级包（R5-07）
        if: steps.prev-release.outputs.prev-version != ''
        shell: pwsh
        run: |
          # neonboard-delta-tool 链了 Qt6::Core，PATH 里没有 Qt bin 会以 0xC0000135 直接死掉
          # （看着像「脚本写坏了」），与上面「数据层自检」同一口径补齐。
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          $prevVersion = '${{ steps.prev-release.outputs.prev-version }}'
          $prevZip = '${{ steps.prev-release.outputs.prev-zip }}'
          $prevDir = Join-Path $PWD 'dist\NeonBoard-prev'
          $deltaDir = Join-Path $PWD 'dist\delta'

          Expand-Archive -LiteralPath $prevZip -DestinationPath $prevDir -Force
          # 解完就删：它落在 dist/ 下，名字是 NeonBoard-<prev>-portable.zip，正好被后面
          # 「上传产物」与 Release files 的 dist/NeonBoard-*-portable.zip glob 命中 ——
          # 上一版的包会被当成新 release 的资产再传一遍（70 MB 白跑，还看着像本次产物）。
          Remove-Item -LiteralPath $prevZip -Force

          # diff + bsdiff + 打包 + 清单条目，只有 scripts/build-delta.ps1 一份实现，
          # 这里只负责把新旧目录和版本号喂给它
          pwsh -NoProfile -File scripts\build-delta.ps1 `
            -FromDir $prevDir `
            -ToDir (Join-Path $PWD 'dist\NeonBoard') `
            -FromVersion $prevVersion `
            -ToVersion $env:RELEASE_VERSION `
            -OutDir $deltaDir
          if ($LASTEXITCODE -ne 0) { throw "增量包生成失败（退出码 $LASTEXITCODE）" }

          # 落到 dist/delta.zip：清单里的 url 与 Release 资产名都取这个文件名
          Move-Item -LiteralPath (Join-Path $deltaDir 'delta.zip') -Destination (Join-Path $PWD 'dist\delta.zip') -Force
          Remove-Item -LiteralPath $prevDir -Recurse -Force
          "DELTA_ZIP=$(Join-Path $PWD 'dist\delta.zip')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DELTA_FROM_VERSION=$prevVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host ("✓ 增量包 {0:N1} KB（$prevVersion → $env:RELEASE_VERSION）" -f `
            ((Get-Item 'dist\delta.zip').Length / 1KB)) -ForegroundColor Green

      - name: 生成更新清单
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path 'dist' -Filter 'NeonBoard-Setup-*.exe' | Select-Object -First 1
          if (-not $setup) { throw '找不到安装包（NeonBoard-Setup-*.exe）' }
          $base = "https://github.com/Reance195/NeonBoard/releases/download/$env:RELEASE_TAG"

          # 清单 schema 只有 scripts/build-update-manifest.ps1 一份实现：客户端按
          # artifacts[].{kind,url,sha256,size,fromVersion} 解析，还会防「单元素数组塌成对象」。
          # 在这里手搓一份等于开第二条漂移路径，且脚本的 -DeltaZip 参数会退化成死代码。
          $manifestArgs = @{
            Version      = $env:RELEASE_VERSION
            Setup        = $setup.FullName
            Portable     = $env:PORTABLE_ZIP
            DownloadBase = $base
            HtmlUrl      = 'https://github.com/Reance195/NeonBoard/releases/latest'
            Notes        = "完整变更记录：https://github.com/Reance195/NeonBoard/commits/$env:RELEASE_TAG"
            OutFile      = 'update.json'
          }
          if ($env:DELTA_ZIP -and (Test-Path -LiteralPath $env:DELTA_ZIP)) {
            $manifestArgs['DeltaZip'] = $env:DELTA_ZIP
            $manifestArgs['DeltaFromVersion'] = $env:DELTA_FROM_VERSION
          }
          & scripts\build-update-manifest.ps1 @manifestArgs

          if (-not (Test-Path -LiteralPath 'update.json')) { throw '更新清单未生成' }
          Get-Content 'update.json' | Write-Host

          # Release 正文必须带上每个产物一行的校验值：客户端回退到 GitHub Releases API 时
          # 只拿得到 tag 与正文，拿不到 update.json，SHA-256 只能从正文里抠。
          # 不带的话，回退路径下完包会因为「清单未提供校验值」而中止 —— 安全策略
          # 不放行无校验的安装，这条回退路就形同废掉。
          $manifest = Get-Content 'update.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $body = New-Object System.Collections.Generic.List[string]
          $body.Add("NeonBoard $env:RELEASE_VERSION")
          $body.Add('')
          $body.Add("完整变更记录：https://github.com/Reance195/NeonBoard/commits/$env:RELEASE_TAG")
          $body.Add('')
          foreach ($a in $manifest.artifacts) {
            $body.Add("$($a.kind)-sha256: $($a.sha256)")
          }
          $bodyPath = Join-Path $PWD 'dist\RELEASE-NOTES.md'
          [System.IO.File]::WriteAllText($bodyPath, (($body -join "`n") + "`n"), (New-Object System.Text.UTF8Encoding($false)))
          Get-Content $bodyPath

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: NeonBoard-setup-${{ github.sha }}
          path: |
            dist/NeonBoard-Setup-*.exe
            dist/NeonBoard-*-portable.zip
            dist/BUILD-INFO.txt
            update.json
          if-no-files-found: error
          retention-days: 30

      # 增量包单独一步：首次发布没有 delta.zip，把它塞进上面那个 if-no-files-found: error
      # 的列表里，会让第一次出包直接红掉
      - name: 上传增量包产物
        if: env.DELTA_ZIP != ''
        uses: actions/upload-artifact@v4
        with:
          name: NeonBoard-delta-${{ github.sha }}
          path: dist/delta.zip
          if-no-files-found: error
          retention-days: 30

      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # 正文自带校验值（见上一步），这也是 API 回退路径唯一的校验值来源
          body_path: dist/RELEASE-NOTES.md
          # 客户端拿清单里的 delta.url 拼出 releases/download/<tag>/delta.zip，
          # 所以这个资产必须真的挂上去 —— 没挂上就是 404，增量白做。
          # glob 不匹配时 softprops 只告警不失败（fail_on_unmatched_files 默认 false）。
          files: |
            dist/NeonBoard-Setup-*.exe
            dist/NeonBoard-*-portable.zip
            dist/BUILD-INFO.txt
            dist/delta*.zip
            update.json

      - name: 回写更新清单到仓库
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # 客户端默认从仓库 raw 读 update.json（Gitee 优先、GitHub 兜底），
          # 所以清单必须回到仓库里，光挂在 Release 资产上客户端找不到。
          # 放在发布之后：即使回写失败，Release 也已经出好了。
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          if (git diff --cached --quiet) {
            Write-Host 'update.json 无变化，跳过提交'
            exit 0
          }
          git commit -m "chore(release): 同步软件更新清单至 $env:RELEASE_VERSION"
          # main 在打包的十几分钟里很可能已被别的自动化（看板回写、CI 修复）推进，
          # 直接推会被 "fetch first" 拒掉 —— v0.1.1 发布时就踩了这个：Release 出好了，
          # 但清单没回到仓库，客户端读 raw 拿到的还是旧版本、判定「已是最新」。
          # 所以先 fetch + rebase 到最新 main 再推，并重试几次防止又被人抢跑。
          $pushed = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git fetch origin main
            if ($LASTEXITCODE -ne 0) { Start-Sleep -Seconds 5; continue }
            # rebase 只重放这一个提交，tag 上的其他内容不会进 main
            git rebase origin/main
            if ($LASTEXITCODE -ne 0) {
              git rebase --abort 2>$null
              throw 'update.json 提交 rebase 到 origin/main 失败'
            }
            git push origin "HEAD:refs/heads/main"
            if ($LASTEXITCODE -eq 0) { $pushed = $true; break }
            Write-Host "第 $attempt 次推送被拒，重新同步后重试"
            Start-Sleep -Seconds 5
          }
          if (-not $pushed) { throw '回写 update.json 失败：origin/main 持续前进，已重试 3 次' }
          Write-Host "已回写 update.json（$env:RELEASE_VERSION）"
