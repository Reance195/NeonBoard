name: CI

on:
  push:
    branches: [ main ]
    # CI 自动回写的快照提交不再触发流水线，避免自激循环
    paths-ignore:
      - 'progress.json'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows 编译与自检
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 看板状态派生器要读完整提交历史（状态来自 #短号 标记），不能只取最近一次提交
          fetch-depth: 0

      - name: 领用闸门（服务端 claim ref）
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          # 领用是服务端占位：分支必须在 refs/claims/<短号> 上占过位，
          # 否则说明绕过了 agent-init 直接建分支 —— 一律不准合入。
          git fetch origin '+refs/claims/*:refs/claims/*'
          python scripts/check_claim_refs.py --base "origin/${{ github.base_ref }}" --head HEAD

      - name: 准备 MSVC 开发环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 安装 Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          # ShaderTools 是独立 addon，缺失会导致 cmake 找不到 Qt6::ShaderTools
          modules: 'qtshadertools'
          cache: true
          cache-key-prefix: 'neonboard-qt'

      - name: 配置 CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"

      - name: 编译 Release
        run: cmake --build build --config Release --parallel

      - name: 数据库自检
        shell: pwsh
        run: |
          # Qt 的 DLL 不在系统 PATH，必须显式加入，否则 exe 找不到 Qt6Core.dll 无法启动
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          $exe = Join-Path $PWD 'build\Release\NeonBoard.exe'
          $proc = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput selftest.out -RedirectStandardError selftest.err
          Get-Content selftest.out -ErrorAction SilentlyContinue
          Get-Content selftest.err -ErrorAction SilentlyContinue
          if ($proc.ExitCode -ne 0) { throw "自检失败，退出码 $($proc.ExitCode)" }

      - name: 冒烟启动并检查日志
        shell: pwsh
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          $exe = Join-Path $PWD 'build\Release\NeonBoard.exe'
          $log = Join-Path $env:APPDATA 'com.lin\NeonBoard\neonboard.log'
          if (Test-Path $log) { Remove-Item $log -Force }

          $proc = Start-Process -FilePath $exe -ArgumentList '--smoke' -PassThru
          $deadline = (Get-Date).AddSeconds(120)
          while (-not $proc.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 3 }
          if (-not $proc.HasExited) {
            Stop-Process -Id $proc.Id -Force
            throw '冒烟启动超时（120 秒未退出）'
          }
          if (-not (Test-Path $log)) { throw '未生成运行日志' }

          $lines = [System.IO.File]::ReadAllLines($log, [System.Text.Encoding]::UTF8)
          $lines | ForEach-Object { Write-Host $_ }

          # QML 与 C++ 侧的致命问题一律拦截，避免「能编译但跑不起来」
          $patterns = 'is not a type|is not a member|TypeError|ReferenceError|' +
                      'Unable to assign|Cannot assign|QQmlApplicationEngine failed|' +
                      '不是一种类型|不是一个类型|不存在的附加对象|没有安装|' +
                      'ASSERT|FATAL|Segmentation'
          $bad = $lines | Where-Object { $_ -match $patterns }
          if ($bad) { throw ("检测到错误日志：`n" + ($bad -join "`n")) }

      - name: 打包便携版
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath 'pwsh' -ArgumentList '-NoProfile','-File','scripts\deploy.ps1','-SkipBuild' `
            -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) { throw "便携版打包失败，退出码 $($proc.ExitCode)" }
          $exe = Join-Path $PWD 'dist\NeonBoard\NeonBoard.exe'
          if (-not (Test-Path $exe)) { throw '便携版产物缺失' }

      - name: 验证便携版可独立运行
        shell: pwsh
        run: |
          # 便携版自带 Qt 运行库，无需再注入 PATH；此步验证 windeployqt 是否打包完整
          $exe = Join-Path $PWD 'dist\NeonBoard\NeonBoard.exe'
          $proc = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) { throw "便携版自检失败，退出码 $($proc.ExitCode)" }

      - name: 看板状态一致性校验
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          # progress.json 里的 status 是派生产物：由 git 提交信息里的 #短号=状态
          # 与 docs/board-ledger.json 台账共同推导，CI 独占写回。
          # 快照与推导结果不一致 → 阻塞合并，必须先跑：
          #   python scripts/derive_board_status.py --write
          python scripts/derive_board_status.py --check
          if ($LASTEXITCODE -ne 0) { throw '看板状态与提交历史/台账不一致，请运行 python scripts/derive_board_status.py --write 后提交' }

      - name: 自动回写看板状态
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          # 主线合并后由 CI 统一回写快照状态，特性分支完全不碰 progress.json，
          # 多代理并行也不会产生快照冲突。
          python scripts/derive_board_status.py --write
          if ($LASTEXITCODE -ne 0) { throw '看板状态派生失败' }
          git config user.name  'neonboard-ci'
          git config user.email 'neonboard-ci@users.noreply.github.com'
          git add progress.json
          if (git diff --cached --quiet) {
            Write-Host '看板状态无变化，无需回写'
            exit 0
          }
          git commit -m 'ci(board): 自动回写看板状态'
          git push origin HEAD:main

      - name: 上传便携版产物
        uses: actions/upload-artifact@v4
        with:
          name: NeonBoard-windows-x64
          path: dist/NeonBoard
          if-no-files-found: error
          retention-days: 30

  # R4-08：单独验证 build.ps1 的 Ninja 生成器路径 + sccache 编译缓存。
  # 与主构建（MSBuild）隔离：continue-on-error 使其只作信号、不阻断合并，
  # 避免 CI 环境偶发问题误伤主线合入。产物落在 build-ninja/（Ninja 单配置）。
  ninja-build:
    name: Ninja 生成器验证（R4-08）
    runs-on: windows-2022
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 MSVC 开发环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 安装 Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtshadertools'
          cache: true
          cache-key-prefix: 'neonboard-qt'

      - name: 安装 Ninja 与 sccache
        shell: pwsh
        run: choco install ninja sccache -y --no-progress

      - name: build.ps1 以 Ninja 构建（含 sccache）
        shell: pwsh
        run: pwsh -NoProfile -File scripts/build.ps1 -Config Release -QtRoot "${{ env.QT_ROOT_DIR }}" -BuildDir build-ninja

      - name: 校验 Ninja 产物
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'build-ninja\NeonBoard.exe'
          if (-not (Test-Path $exe)) { throw "Ninja 构建未生成 $exe" }
          Write-Host "Ninja 产物就绪：$exe" -ForegroundColor Green
