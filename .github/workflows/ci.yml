name: CI

on:
  push:
    branches: [ main ]
    # CI 自动回写的快照提交不再触发流水线，避免自激循环；
    # update.json 由发布流水线回写，同样不该触发一次完整构建
    paths-ignore:
      - 'progress.json'
      - 'update.json'
      # 纯文档改动不触发全量构建（Qt 安装 + 编译 ≈ 8 分钟）
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows 编译与自检
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 看板状态派生器要读完整提交历史（状态来自 #短号 标记），不能只取最近一次提交
          fetch-depth: 0

      - name: 安装仓库钩子（core.hooksPath）
        # 该配置是仓库级的、不随 clone 传递：不装则分支保护 / 提交格式 / 任务闸门全部静默失效。
        # 幂等，本地由 scripts/agent-init.ps1 与 scripts/build.ps1 一并带上。
        shell: pwsh
        run: pwsh -NoProfile -File scripts/setup-git-hooks.ps1

      - name: 代码格式检查（clang-format，棘轮：只查本次改动的 C++ 文件）
        # 先作为信号运行（非阻塞）：现存历史文件未做一次性重排，
        # 等格式基线稳定后把 continue-on-error 去掉即为硬门禁。
        continue-on-error: true
        shell: pwsh
        run: |
          python -m pip install --quiet clang-format
          $base = if ($env:GITHUB_EVENT_NAME -eq 'pull_request') { "origin/$($env:GITHUB_BASE_REF)" } else { 'HEAD~1' }
          pwsh -NoProfile -File scripts/check-format.ps1 -Base $base

      - name: 任务卡范围检查（棘轮：卡片声明 scope 后才生效）
        # 与格式检查一样先作信号：存量卡片逐步补 scope，
        # 缺失时脚本只告警不拦截；全部补齐后去掉 continue-on-error 即硬门禁。
        continue-on-error: true
        shell: pwsh
        run: |
          $base = if ($env:GITHUB_EVENT_NAME -eq 'pull_request') { "origin/$($env:GITHUB_BASE_REF)" } else { 'HEAD~1' }
          python scripts/check_scope.py --base $base

      - name: 脚本卫生检查（路径单一口径 / 钩子豁免只有一处）
        shell: pwsh
        run: |
          # 把宪章里两条「唯一」落到机器校验：应用数据目录的字面量只许出现在
          # scripts/nb-paths.ps1（PS 侧）与 scripts/claim-card.py（Python 侧镜像），
          # git commit --no-verify 只许出现在快照回写那一步（AGENTS.md §7.6、§11.2 第 7 条）。
          # 散文条款靠人记一定会漂 —— 本次 CI 常红就是这么来的。
          python scripts/check_script_hygiene.py
          if ($LASTEXITCODE -ne 0) { throw '脚本卫生检查未通过' }

      - name: 代登记审计自测（DX-06）
        shell: pwsh
        run: |
          # 「维护者可授权代登记」这条例外长期只校验位置（非 .worktrees 直接放行），
          # 内容没人管，等于口头免责。现在提交信息本身就是审计凭证：类型固定 chore(board)、
          # body 必须有「授权：」「批次：」两行、且不得与代码混提交。
          # 判定逻辑在 scripts/task_gate.py（唯一实现），此处只跑它的可执行自测：
          # 允许与拒绝各若干例（含混提交、缺审计行），规则改动时用例跟着一起改。
          python scripts/task_gate.py selftest
          if ($LASTEXITCODE -ne 0) { throw '代登记审计自测未通过：允许/拒绝用例与预期不符' }

      - name: 一分支多卡自测（DX-03）
        shell: pwsh
        run: |
          # 领用闸门原先「一个分支只允许领一张卡」，与 task_gate push 的逐提交校验打架：
          # 两卡一分支时第二张无处领用，只能把占位建在一次性分支上再释放（属于绕行）。
          # 现口径改为「每个出现在分支上的短号都必须各自持证」—— 多领合法、缺证照拒，
          # 顺带能识别「先写代码后补领用」的方向倒置（只告警）。
          # 判定实现在 scripts/check_claim_refs.py（唯一实现），此处只跑其纯函数自测。
          python scripts/check_claim_refs.py --selftest
          if ($LASTEXITCODE -ne 0) { throw '一分支多卡自测未通过：短号提取 / 方向告警用例与预期不符' }

      - name: 领用闸门（服务端 claim ref）
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          # 领用是服务端占位：分支必须在 refs/claims/<短号> 上占过位，
          # 否则说明绕过了 agent-init 直接建分支 —— 一律不准合入。
          git fetch origin '+refs/claims/*:refs/claims/*'
          python scripts/check_claim_refs.py --base "origin/${{ github.base_ref }}" --head HEAD

      - name: 准备 MSVC 开发环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 安装 Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          # ShaderTools 是独立 addon，缺失会导致 cmake 找不到 Qt6::ShaderTools
          modules: 'qtshadertools'
          cache: true
          cache-key-prefix: 'neonboard-qt'

      - name: 编译缓存（sccache）
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          key: neonboard-sccache-${{ runner.os }}

      - name: 配置 CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}" -DBUILD_TESTING=ON -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: 编译 Release
        run: cmake --build build --config Release --parallel

      - name: 单元测试（质量门禁）
        shell: pwsh
        run: |
          # 门禁定位：纯逻辑层（解析器 / 插件包）回归前移到单元测试，
          # 不再依赖「起 GUI 跑一遍」才能发现逻辑退化。
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw '单元测试未通过，禁止合入' }

      - name: 数据库自检
        shell: pwsh
        run: |
          # Qt 的 DLL 不在系统 PATH，必须显式加入，否则 exe 找不到 Qt6Core.dll 无法启动
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          $exe = Join-Path $PWD 'build\Release\NeonBoard.exe'
          $proc = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput selftest.out -RedirectStandardError selftest.err
          Get-Content selftest.out -ErrorAction SilentlyContinue
          Get-Content selftest.err -ErrorAction SilentlyContinue
          if ($proc.ExitCode -ne 0) { throw "自检失败，退出码 $($proc.ExitCode)" }

      - name: 打包便携版
        # 排在冒烟之前：startup 指标要测的是真正发布的便携包（冷启动、无系统缓存），
        # 而不是 build/Release 下靠 QT_ROOT_DIR\bin 注入 DLL 的开发态 exe（见 R0-11）。
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath 'pwsh' -ArgumentList '-NoProfile','-File','scripts\deploy.ps1','-SkipBuild' `
            -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) { throw "便携版打包失败，退出码 $($proc.ExitCode)" }
          $exe = Join-Path $PWD 'dist\NeonBoard\NeonBoard.exe'
          if (-not (Test-Path $exe)) { throw '便携版产物缺失' }

      - name: 验证便携版可独立运行
        shell: pwsh
        run: |
          # 便携版自带 Qt 运行库，无需再注入 PATH；此步验证 windeployqt 是否打包完整
          $exe = Join-Path $PWD 'dist\NeonBoard\NeonBoard.exe'
          $proc = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) { throw "便携版自检失败，退出码 $($proc.ExitCode)" }

      - name: 冒烟启动并检查日志
        shell: pwsh
        run: |
          # 测便携包本体：自带 Qt 运行库，无需注入 QT_ROOT_DIR\bin，
          # 这样 startup 反映的是 issue #4 的「冷启动、空磁盘缓存」用户场景。
          $exe = Join-Path $PWD 'dist\NeonBoard\NeonBoard.exe'
          # 日志位置的唯一口径（尊重 NEONBOARD_DATA_DIR，与本地 verify.ps1 同一个函数）
          . (Join-Path $PWD 'scripts\nb-paths.ps1')
          $log = Get-NbLogFile
          if (Test-Path $log) { Remove-Item $log -Force }

          $proc = Start-Process -FilePath $exe -ArgumentList '--smoke' -PassThru
          $deadline = (Get-Date).AddSeconds(45)
          while (-not $proc.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 3 }
          if (-not $proc.HasExited) {
            Stop-Process -Id $proc.Id -Force
            throw '冒烟启动超时（45 秒未退出）'
          }
          if (-not (Test-Path $log)) { throw '未生成运行日志' }

          $lines = [System.IO.File]::ReadAllLines($log, [System.Text.Encoding]::UTF8)
          $lines | ForEach-Object { Write-Host $_ }

          # QML 与 C++ 侧的致命问题一律拦截，避免「能编译但跑不起来」
          $patterns = 'is not a type|is not a member|TypeError|ReferenceError|' +
                      'Unable to assign|Cannot assign|QQmlApplicationEngine failed|' +
                      '不是一种类型|不是一个类型|不存在的附加对象|没有安装|' +
                      'ASSERT|FATAL|Segmentation'
          $bad = $lines | Where-Object { $_ -match $patterns }
          if ($bad) { throw ("检测到错误日志：`n" + ($bad -join "`n")) }

      - name: 性能基线（--smoke 的 startup / fps / mem）
        # 只告警不拦截：先积累几轮数据，确认基线稳定后再去掉 continue-on-error。
        continue-on-error: true
        shell: pwsh
        run: |
          . (Join-Path $PWD 'scripts\nb-paths.ps1')
          $log = Get-NbLogFile
          pwsh -NoProfile -File scripts/check-perf.ps1 -LogPath $log

      - name: 结卡自测（DX-07）
        shell: pwsh
        run: |
          # baseline=<短号> done 是「拒绝重新领用」的门（AGENTS.md 条款 6）。
          # 过去靠维护者记得批量结 —— 一定漂；每漂一次，已交付的卡就能被再领一遍重做
          # （docs/pitfalls.md 1.14 踩过，7.1 曾记作「待拍板」）。DX-07 起由 git-done 收尾的
          # `derive_board_status.py --close-cards` 按 git 标记自动结。
          # 判定实现在 derive_board_status.py（纯函数 close_cards），此处跑它的自测：
          # 有标记则结 / 无标记不动 / 已结不重复 / 缺条目补 todo 而非 done / 幂等 / 不擅自重开。
          python scripts/derive_board_status.py --selftest
          if ($LASTEXITCODE -ne 0) { throw '结卡自测未通过：结卡判定用例与预期不符' }

      - name: 台账 baseline 漂移回归探针（DX-07 起从待决项降为探针）
        shell: pwsh
        run: |
          # DX-07 之前这一步的定位是「只报不改的待决项」（pitfalls 7.1）。结卡自动化后，
          # 它降级为**回归探针**：漂移非零说明 git-done 那次结卡提交没成功（离线/撞车/脚本失败）。
          # 仍不阻断 job —— 结卡失败不该连带整轮红，但必须让人看见。
          python scripts/derive_board_status.py --baseline-check
          if ($LASTEXITCODE -ne 0) {
            Write-Host "· baseline 检查未能完成（退出码 $LASTEXITCODE），按设计不阻断本 job" -ForegroundColor Yellow
          }

      # 看板状态的校验与回写已迁出本 job（DX-13）：见 .github/workflows/board.yml。
      # 原「看板状态一致性校验」带 if: github.event_name == 'pull_request'，
      # 而本仓库走 git-done 直推 main、零 PR，该步骤从未运行（实测 skipped）；
      # 原「自动回写看板状态」待在本 job 内，而本 workflow 的 paths-ignore 含 docs/**，
      # 结卡这类 docs-only 提交根本不触发它 —— 漂移要等下一次代码推送才被顺带补平。
      # 现在由独立轻量 job 承担：push 回写、PR 校验，progress.json 保持单写者。
      - name: 上传便携版产物
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: NeonBoard-windows-x64
          path: dist/NeonBoard
          if-no-files-found: error
          retention-days: 30

  # R4-08：单独验证 build.ps1 的 Ninja 生成器路径 + sccache 编译缓存。
  # 与主构建（MSBuild）隔离：continue-on-error 使其只作信号、不阻断合并，
  # 避免 CI 环境偶发问题误伤主线合入。产物落在 build-ninja/（Ninja 单配置）。
  # 该作业会完整构建第二遍（+5–7 分钟），只保留手动触发/手动验证时运行。
  ninja-build:
    if: github.event_name == 'workflow_dispatch'
    name: Ninja 生成器验证（R4-08）
    runs-on: windows-2022
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 MSVC 开发环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 安装 Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtshadertools'
          cache: true
          cache-key-prefix: 'neonboard-qt'

      - name: 安装 Ninja 与 sccache
        shell: pwsh
        run: choco install ninja sccache -y --no-progress

      - name: build.ps1 以 Ninja 构建（含 sccache）
        shell: pwsh
        run: pwsh -NoProfile -File scripts/build.ps1 -Config Release -QtRoot "${{ env.QT_ROOT_DIR }}" -BuildDir build-ninja

      - name: 校验 Ninja 产物
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'build-ninja\NeonBoard.exe'
          if (-not (Test-Path $exe)) { throw "Ninja 构建未生成 $exe" }
          Write-Host "Ninja 产物就绪：$exe" -ForegroundColor Green
