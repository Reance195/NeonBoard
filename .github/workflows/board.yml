# Board —— 看板状态一致性（只校验，不回写）
#
# DX-13：这道门原先挂在 ci.yml 的 build job 里，实际从未生效 ——
#   1) 「看板状态一致性校验」步骤带 if: github.event_name == 'pull_request'，
#      而本仓库走 git-done 直推 main、零 PR（gh pr list --state all 为空）；
#      实测 run 40922484744 该步骤结论为 skipped。
#   2) ci.yml 的 paths-ignore 含 docs/**，结卡这类只改 docs/board-ledger.json
#      的提交根本不触发流水线（gh api .../commits/<sha>/check-runs 为空）。
# 当时拆成本文件这个独立轻量 job（不装 Qt、不编译，几十秒出结果），并让它在
# main push 时**回写** progress.json，理由是「CI 独占写回，特性分支不碰」。
#
# 但 CI 与 git-done 的收尾在抢写同一个文件，实测每次合并必撞（R14-01，2026-11-03）：
#   21:55:42 合并提交 4d125d1 推上 main
#   21:56:00 本 workflow 回写 progress.json，推 c7d0d43
#   → git-done 本地基于 4d125d1 做的结卡 / 台账清理 / 快照提交全部 non-fast-forward
#   → 三件收尾全部回滚，只能人工补（d064c12）。
# 两个写者写同一个派生文件，谁先推谁赢，另一个必然白干；而且脚本是 fail-soft 的，
# 这类失败不会报错，只会在输出里留几行「补推失败」。
#
# 现在把写权收归一处：**git-done 独占**（合并收尾的 derive --write / --close-cards）。
# CI 只校验：不一致就报红，由人按提示在本地补跑收尾，不再自作主张改主干。
# 本文件因此不含任何提交 / 推送动作，permissions 降为 contents: read。
# （自检口径：在本文件里 grep 提交与推送命令应当一个都找不到 —— 只有触发用的 push:。）

name: Board

on:
  push:
    branches: [ main ]
    paths-ignore:
      # 发布流水线回写的清单与看板状态无关，不必触发校验。
      # progress.json 刻意**不**忽略：快照变更恰恰最需要被校验 ——
      # 原先忽略它是为了躲开自己回写造成的自激，不回写了就没有这个顾虑。
      #
      # 预期行为（DX-44 改写）：**中间态不再产生 failure run**。
      # 一次 git-done 收尾会分步快进补推 3~4 个提交（合并 / 清理登记 / 结卡 / 快照），
      # 每个都不自洽（快照必须最后刷新，因为派生器要读前几步写完的 git 事实），
      # 首步先沉降等待 ~30s（实测推送间隔 6~13s，留足余量），保证 job 一定比推送间隔久；
      # 于是 concurrency.cancel-in-progress=true 下，新推送到来时上一个 run 仍在沉降中
      # （in-progress）被判为过时并取消，不发失败通知。
      #
      # 因此判据落点自动挪到 **main tip 那一个 run**：
      #   - main tip 绿 = 收尾完成、快照与 git 事实一致；
      #   - main tip 红 = 收尾那几步真的失败了（离线 / 撞车 / 脚本失败），照提示补跑。
      # 校验本身一档没松：--check 对中间态照样返回非零，只是那次 run 不再被留着报红。
      - 'update.json'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'update.json'
  workflow_dispatch:

# 只读：本 workflow 不再需要推送权限。留着 write 等于给「以后又加回写」留口子。
permissions:
  contents: read

concurrency:
  group: board-${{ github.ref }}
  # DX-44：这里必须是 true。
  # 一次收尾推 3~4 个提交，前几个是注定短暂的中间态（快照还没刷），false 时它们
  # 各自排队跑完并各自报红 —— 实测每批收尾固定产 1~3 封失败邮件（R16-05 3 封、
  # R5-08 2 封、R5-10 2 封、DX-40 立卡 1 封），噪声大到没人再看这条流水线。
  # 关键在 job 必须比推送间隔久：首步沉降等待 ~30s（实测推送间隔 6~13s），中间 run 在新推送
  # 到来时仍在 sleep 中（in-progress）被取消。只有最后一个（= main tip）会睡醒跑完并给出结论。
  # 校验逻辑与权限一字未动。
  cancel-in-progress: true

jobs:
  board:
    name: 看板状态一致性（派生校验）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # DX-44：收尾一次推 3~4 个提交（合并 / 清理登记 / 结卡 / 快照），前几个是注定短暂的中间态。
      # cancel-in-progress 只能在「上一个 run 还在跑」时取消它，所以 job 必须比推送间隔久。
      # 首步沉降等待 ~30s（实测推送间隔 6~13s，留足余量）：中间 run 在新推送到来时仍处于
      # in-progress（sleep 中）被取消、不落 failure；只有 main tip 那个 run 睡醒后真正校验。
      # 校验本身不松（--check 对中间态仍返回非零），只是那次 run 不再被留着报红。
      - name: 等待收尾沉降（debounce）
        run: sleep 30

      - uses: actions/checkout@v4
        with:
          # 派生器要读完整提交历史里的 #短号=done 标记，浅克隆会漏
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # DX-76：僵尸 claim 占位巡检。判定单一实现在 scripts/check_claim_refs.py
      # （classify_claim，与 git-done 收尾的自动释放共用同一份），这里只点名与拦截：
      # main tip 红说明收尾的释放没跑到（离线 / 撞车 / 脚本失败），按输出补跑即可。
      # CI 只读不代删（permissions: contents: read，本 workflow 不该有推送能力）。
      - name: 领用占位巡检（僵尸 claim ref 点名）
        run: python scripts/check_claim_refs.py --audit-zombies

      # main push 与 PR 同一把尺子：以前 main 走「回写自愈」、PR 走「校验阻塞」，
      # 两条路给不同结论，正是双写者模式的产物。
      - name: 校验
        run: |
          python scripts/derive_board_status.py --check
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::看板状态与提交历史/台账不一致。写权归 git-done，CI 不再回写：请重跑一次合并收尾，或在锚点区手工跑 derive_board_status.py --close-cards / --write 后推 main。"
            exit "$code"
          fi
